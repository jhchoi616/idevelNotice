spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=update

# 파일 업로드 전송 방식에 따른 최대 용량 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# 파일 업로드 경로
