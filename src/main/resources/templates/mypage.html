<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/header ::head('내정보')}"></head>
<head>
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<main class="mypage-container">

    <div class="mypage-header">
        <h1>내 정보</h1>
        <p>회원 정보를 확인하고 수정할 수 있습니다.</p>
    </div>

    <div
        th:if="${param.success}"
        class="mypage-success"
    >
        회원 정보가 수정되었습니다.
    </div>

    <form
        class="mypage-form"
        th:action="@{/mypage}"
        method="post"
        th:object="${member}"
    >

        <div class="form-group">
            <label for="username">아이디</label>

            <input
                type="text"
                id="username"
                th:value="${member.username}"
                readonly
            >

            <small>
                아이디는 변경할 수 없습니다.
            </small>
        </div>


        <div class="form-group">
            <label for="nickname">닉네임</label>

            <input
                type="text"
                id="nickname"
                name="nickname"
                th:value="${member.nickname}"
                maxlength="30"
                required
            >

            <div
                class="field-error"
                th:if="${#fields.hasErrors('nickname')}"
                th:errors="*{nickname}">
            </div>
        </div>


        <div class="form-group">
            <label for="email">이메일</label>

            <input
                type="email"
                id="email"
                name="email"
                th:value="${member.email}"
                required
            >

            <div
                class="field-error"
                th:if="${#fields.hasErrors('email')}"
                th:errors="*{email}">
            </div>
        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn-submit"
            >
                정보 수정
            </button>

            <a
                th:href="@{/}"
                class="btn-cancel"
            >
                취소
            </a>

        </div>

    </form>

    <div class="password-section" hidden>

        <h2>비밀번호</h2>

        <p>
            비밀번호를 변경하려면 비밀번호 변경 페이지로 이동해주세요.
        </p>

        <a
            th:href="@{/mypage/password}"
            class="btn-password"
        >
            비밀번호 변경
        </a>

    </div>

</main>

<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
