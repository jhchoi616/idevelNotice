<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/header :: head('로그인')}"></head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>로그인 | Notice</title>

    <style>


        .login-container {
            width: 100%;
            max-width: 420px;
            margin: 100px auto;
            padding: 40px;
            background-color: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .login-title {
            margin: 0 0 8px;
            text-align: center;
            font-size: 28px;
        }

        .login-description {
            margin: 0 0 30px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            height: 46px;
            padding: 0 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;
            height: 46px;
            margin-top: 8px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #1d4ed8;
        }

        .error-message {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 6px;
            background-color: #fef2f2;
            color: #dc2626;
            font-size: 14px;
            text-align: center;
        }

        .login-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .login-links a {
            color: #555;
            text-decoration: none;
        }

        .login-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
<header th:replace="~{layout/header :: header}"></header>
<main class="login-container">

    <h1 class="login-title">로그인</h1>

    <p class="login-description">
        Notice에 로그인하세요.
    </p>

    <!-- 로그인 실패 -->
    <div class="error-message"
         th:if="${param.error}">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <!-- 로그아웃 -->
    <div class="error-message"
         th:if="${param.logout}">
        로그아웃되었습니다.
    </div>

    <!--
        POST /login
        Spring Security가 직접 처리한다.
    -->
    <form th:action="@{/login}" method="post">

        <div class="form-group">
            <label for="username">아이디</label>

            <input type="text"
                   id="username"
                   name="username"
                   placeholder="아이디를 입력하세요"
                   autocomplete="username"
                   required>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="비밀번호를 입력하세요"
                   autocomplete="current-password"
                   required>
        </div>

        <button type="submit"
                class="login-button">
            로그인
        </button>

    </form>

    <div class="login-links">
        <a href="/">메인으로</a>
    </div>

</main>
<footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>
