<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>오류</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        .error-container {
            width: 500px;
            margin: 150px auto;
            padding: 50px;
            background: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .error-container h1 {
            margin-bottom: 20px;
        }

        .error-message {
            margin-bottom: 30px;
            color: #555;
        }

        .home-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .home-btn:hover {
            background: #444;
        }
    </style>
</head>

<body>

<div class="error-container">

    <h1 th:text="${status} ?: 500">500</h1>
    <h1>오류가 발생했습니다.</h1>

    <p class="error-message" th:text="${message} ?: '요청을 처리하는 중 오류가 발생했습니다.'">
        요청을 처리하는 중 오류가 발생했습니다.
    </p>
    
    <a href="/" class="home-btn">
        홈으로
    </a>

</div>

</body>
</html>
