<!DOCTYPE html>

<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

<title>회원가입</title>

<link rel="stylesheet"
      th:href="@{/css/common.css}">
<link rel="stylesheet"
      th:href="@{/css/signup.css}">

</head>

<body>

<header th:replace="~{layout/header :: header}"></header>

<main class="auth-container">

<section class="auth-card">

    <h1 class="auth-title">회원가입</h1>

    <p class="auth-description">
        새로운 계정을 만들어보세요.
    </p>

    <div th:if="${error}"
         class="auth-error"
         th:text="${error}">
    </div>

    <form th:action="@{/signup}"
          method="post"
          id="signupForm">

        <!-- CSRF 토큰 -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <!-- 아이디 -->
        <div class="form-group">
            <label for="username">아이디</label>

            <input type="text"
                   id="username"
                   name="username"
                   required
                   autocomplete="username">
        </div>

        <!-- 비밀번호 -->
        <div class="form-group">
            <label for="password">비밀번호</label>

            <input type="password"
                   id="password"
                   name="password"
                   required
                   minlength="6"
                   autocomplete="new-password">

            <small id="passwordMessage" class="validation-message">
                6자리 이상, 영문·숫자·특수문자를 포함해야 합니다.
            </small>
        </div>

        <!-- 닉네임 -->
        <div class="form-group">
            <label for="nickname">닉네임</label>

            <input type="text"
                   id="nickname"
                   name="nickname"
                   required>
        </div>

        <!-- 이메일 -->
        <div class="form-group">
            <label for="email">이메일</label>

            <input type="email"
                   id="email"
                   name="email"
                   required
                   autocomplete="email">

            <small id="emailMessage" class="validation-message"></small>
        </div>

        <button type="submit"
                class="btn btn-primary">
            회원가입
        </button>

    </form>

    <div class="auth-footer">
        이미 계정이 있으신가요?
        <a th:href="@{/login}">로그인</a>
    </div>

</section>


</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

<script>
    const form = document.getElementById('signupForm');

    const password = document.getElementById('password');
    const passwordMessage = document.getElementById('passwordMessage');

    const email = document.getElementById('email');
    const emailMessage = document.getElementById('emailMessage');


    /*
     * 비밀번호 유효성 검사
     *
     * 조건
     * 1. 6자리 이상
     * 2. 영문 포함
     * 3. 숫자 포함
     * 4. 특수문자 포함
     */
    function validatePassword() {

        const value = password.value;

        const hasLength = value.length >= 6;
        const hasEnglish = /[A-Za-z]/.test(value);
        const hasNumber = /[0-9]/.test(value);
        const hasSpecial = /[^A-Za-z0-9]/.test(value);

        if (!value) {
            passwordMessage.textContent =
                '6자리 이상, 영문·숫자·특수문자를 포함해야 합니다.';

            passwordMessage.classList.remove('valid');
            passwordMessage.classList.add('invalid');

            return false;
        }

        if (!hasLength || !hasEnglish || !hasNumber || !hasSpecial) {

            passwordMessage.textContent =
                '비밀번호는 6자리 이상이며 영문, 숫자, 특수문자를 모두 포함해야 합니다.';

            passwordMessage.classList.remove('valid');
            passwordMessage.classList.add('invalid');

            return false;
        }

        passwordMessage.textContent =
            '사용 가능한 비밀번호입니다.';

        passwordMessage.classList.remove('invalid');
        passwordMessage.classList.add('valid');

        return true;
    }


    /*
     * 이메일 유효성 검사
     */
    function validateEmail() {

        const value = email.value.trim();

        // 기본적인 이메일 형식 검사
        const emailPattern =
            /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

        if (!value) {
            emailMessage.textContent = '';

            emailMessage.classList.remove('valid');
            emailMessage.classList.remove('invalid');

            return false;
        }

        if (!emailPattern.test(value)) {

            emailMessage.textContent =
                '올바른 이메일 형식을 입력해주세요.';

            emailMessage.classList.remove('valid');
            emailMessage.classList.add('invalid');

            return false;
        }

        emailMessage.textContent =
            '사용 가능한 이메일 형식입니다.';

        emailMessage.classList.remove('invalid');
        emailMessage.classList.add('valid');

        return true;
    }


    // 입력할 때마다 검사
    password.addEventListener('input', validatePassword);
    email.addEventListener('input', validateEmail);


    /*
     * 회원가입 제출 전 최종 검사
     */
    form.addEventListener('submit', function (event) {

        const passwordValid = validatePassword();
        const emailValid = validateEmail();

        if (!passwordValid || !emailValid) {

            event.preventDefault();

            if (!passwordValid) {
                password.focus();
                return;
            }

            if (!emailValid) {
                email.focus();
            }
        }
    });
</script>

</body>
</html>
